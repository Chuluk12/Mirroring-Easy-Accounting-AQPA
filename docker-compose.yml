version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: easy-dashboard-backend
    ports:
      - "${EASY_BACKEND_PORT:-5001}:5001"
    environment:
      - EASY_DB_HOST=${EASY_DB_HOST:-192.168.10.5}
      - EASY_DB_PORT=${EASY_DB_PORT:-3999}
      - EASY_DB_PATH=${EASY_DB_PATH:-E:/EASY/AQPA.EASY6}
      - EASY_DB_USER=${EASY_DB_USER:-SYSDBA}
      - EASY_DB_PASSWORD=${EASY_DB_PASSWORD:-NewPassword123}
      - APP_DB_ENGINE=${APP_DB_ENGINE:-sqlite}
      - APP_DB_HOST=${APP_DB_HOST:-127.0.0.1}
      - APP_DB_PORT=${APP_DB_PORT:-5432}
      - APP_DB_NAME=${APP_DB_NAME:-easy_dashboard}
      - APP_DB_USER=${APP_DB_USER:-postgres}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:-}
      - DRIVER_INTEGRATION_API_KEY=${DRIVER_INTEGRATION_API_KEY:-}
      - EASY_INTEGRATION_API_KEY=${EASY_INTEGRATION_API_KEY}
      - EASY_BACKEND_PORT=5000
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: easy-dashboard-frontend
    ports:
      - "${FRONTEND_PORT:-4176}:5173"
    environment:
      - VITE_API_URL=http://localhost:${EASY_BACKEND_PORT:-5000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend
